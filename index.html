<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <!-- GAME TITLE -->
  <h1>Rock Paper Scissors</h1>
  <p>First to 5 points wins!</p>
  
  <!-- SCORE DISPLAY - Shows current scores -->
  <div id="score">Human: 0 | Computer: 0 | Rounds: 0</div>
  
  <!-- GAME STATUS - Shows winner announcement -->
  <div id="game-status"></div>
  
  <!-- CONTROLS SECTION -->
  <div id="controls">
    <h3>Make your choice:</h3>
    
    <button class="game-btn rock-btn">Rock</button>
    <button class="game-btn paper-btn">Paper</button>
    <button class="game-btn scissors-btn">Scissors</button>
  </div>
  
  <div id="reset-section">
    <button class="reset-btn">New Game</button>
  </div>
  
  <!-- ROUND RESULTS - Shows each round's outcome -->
  <h3>Round History</h3>
  <div id="results"></div>
  
  <!-- LINK TO YOUR JAVASCRIPT FILE -->
  <script src="script.js"></script>
  
</body>
</html>
